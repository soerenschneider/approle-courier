# HAProxy in front of approle-courier, as in production
# (contrib/ansible/haproxy-approle-courier.cfg.j2): HAProxy terminates TLS
# and forwards plain HTTP, passing the client address on with the PROXY
# protocol. approle-courier must run with proxy_protocol and list this proxy
# in trusted_proxies.

global
    log stdout format raw local0

defaults
    log global
    timeout connect 5s
    timeout client 30s
    # Longer than approle-courier's 30s WriteTimeout.
    timeout server 35s

frontend approle_courier_https
    mode http
    option httplog
    bind :8080 ssl crt /certs/haproxy.pem
    default_backend approle_courier

backend approle_courier
    mode http
    # Route on readiness. On SIGTERM approle-courier reports not ready for
    # drain_delay (5s) before closing, which covers inter 2s * fall 2.
    option httpchk GET /readyz
    http-check expect status 200
    server bb approle-courier:8080 send-proxy-v2 check check-send-proxy inter 2s fall 2 rise 2
